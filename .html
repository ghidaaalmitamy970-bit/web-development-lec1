<!DOCTYPE html>
<html>

<head>
    <title>تنفيذ محاضرة م ايمن</title>
</head>

<body>

    <h1>My First web page</h1>
    <p>my first paragraph</p>

    <p id="demo"></p>

    <!-- هنا بنغير محتوى العنصر باستخدام innerHTML -->
    <script>
        document.getElementById("demo").innerHTML = "<h2>Hello World</h2>";
    </script>

    <!-- هنا بنستخدم innerText بدل innerHTML -->
    <!-- برضو بيغير المحتوى، لكن بيعرض الوسوم كنص عادي -->
    <!--
    <script>
        document.getElementById("demo").innerText = "<h2>Hello World</h2>";
    </script>
    -->

    <!-- هنا بنستخدم document.write لعرض مجموع رقمين -->
    <script>
        document.write(5 + 6);
    </script>

    <!-- طريقة اخرى مباشرة لعرض مجموع رقمين في الصفحة -->
    <button type="button"
        onclick="document.write(5 + 6)">
        Try it
    </button>

    <!-- هنا بنستخدم window.alert لعرض نافذة منبثقة -->
    <script>
        window.alert(5 + 6);
    </script>

    <!-- برضو نقدر نستخدم alert مباشرة بدون window -->
    <script>
        alert(5 + 6);
    </script>

    <!-- هنا بنستخدم console.log لعرض البيانات في الكونسول -->
    <script>
        console.log("hello teacher");
    </script>

    <!-- هنا بنستخدم window.print لطباعة الصفحة -->
    <button type="button" onclick="window.print()">
        Print this page
    </button>

</body>
</html>

<!DOCTYPE html>
<html>

<head>
    <title>Student Grade Calculator</title>
</head>

<body>
    <h1>Student Grade Calculator</h1>
    <p>Enter Student Information</p>
    <label>Student Name:</label>
    <input type="text" id="studentName">
    <br><br>
    <label>Subject 1:</label>
    <input type="number" id="sub1">
    <br><br>
    <label>Subject 2:</label>
    <input type="number" id="sub2">
    <br><br>
    <label>Subject 3:</label>
    <input type="number" id="sub3">
    <br><br>
    <button onclick="calculateGrade()">Calculate</button>
    <p id="result"></p>

    <script>

    function calculateGrade() {

    
    var name = document.getElementById("studentName").value;
    var s1 = Number(document.getElementById("sub1").value);
    var s2 = Number(document.getElementById("sub2").value);
    var s3 = Number(document.getElementById("sub3").value);

    var total = s1 + s2 + s3;
    var avg = total / 3;

    document.getElementById("result").innerHTML =
        "<h2>Student Result</h2>" +
        "Student Name: " + name + "<br>" +
        "Total: " + total + "<br>" +
        "Average: " + avg;
    console.log("Student Name:", name);
    console.log("Total:", total);
    console.log("Average:", avg);

}

</script>
</body>
</html>
